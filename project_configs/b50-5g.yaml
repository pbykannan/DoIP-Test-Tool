# 北汽 B50-5G TBOX 陪测配置
# 压缩包架构参考 N80：DoIP 包内 1-*.s19 + 2-*.zip + 5-*.xml
# 刷写例程对齐 B50-4G/335：仅 0203 + 0202×2 → 1101（无 FF00/FF01）
# 依据：
#  - N80KS TBX 诊断协议 / 《UDS安全访问认证方案 v2.0》密钥因子
#  - 例程表：checkProgrammingPreconditions 0x0203、checkRoutine 0x0202（CRC32）
# 密钥/IP 等可按 B50-5G 台架另行覆盖
network:
  host: "192.168.4.43"
  tcp_port: 13400
  udp_port: 13400
  # DoIP 发现：known_ip=已知 IP 直连；broadcast=UDP 广播；multicast=UDP 组播
  discovery_mode: "known_ip"
  multicast_address: "239.2.0.1"
  client_bind_ip: null

doip:
  client_logical_address: 0x0E80
  server_logical_address: 0x002B
  protocol_version: 3
  socket_read_timeout: 15
  activation_type: "Default"
  activation_disabled: false
  vm_specific: 0
  uds_addressing: "physical"
  functional_logical_address: 0xE400

uds:
  request_timeout: 30
  # use_server_timing=true：进入会话后采用 ECU 在 0x10 响应中宣告的 P2/P2*；
  # p2_timeout 仅作为未取得 ECU 时间参数前的兜底。
  # 注意：若 ECU 宣告 P2=50ms 但实际 NRC 78 常 60ms+ 才回，应改回
  # use_server_timing=false + p2_timeout=0.5 以本地超时等待。
  use_server_timing: false
  p2_timeout: 0.05
  p2_star_timeout: 5
  server_address_format: null
  server_memorysize_format: null
  # 北汽 v2.0 认证：SK=CMAC(Key, DF)，Token=CMAC(SK, Seed)，27 02 上传 32 字节 DF||Token
  security_algorithm: "baic-df-token"
  # 密钥因子（16 字节）：UDS=L1；BOOT=L3（B50-4G/5G 共用）
  security_key_level1: "F66EF1DE91B987096FEF02AFE2307FC6"
  security_key_level3: "9848BFCD817E43449312039EA703DB79"

diagnostics:
  # 诊断树（仅 UI 左侧“服务树”）；来源：N80KS TBX 诊断协议 V1.0
  service_presets:
    - sid: 0x10
      items:
        - request: "1001"
          comment: "默认会话"
        - request: "1002"
          comment: "编程会话"
        - request: "1003"
          comment: "扩展会话"
    - sid: 0x11
      items:
        - request: "1101"
          comment: "硬复位(触发OTA)"
        - request: "1103"
          comment: "软复位"
    - sid: 0x14
      items:
        - request: "14FFFFFF"
          comment: "清除全部 DTC"
    - sid: 0x19
      items:
        - request: "1901FF"
          comment: "按状态掩码读 DTC 数量"
        - request: "1902FF"
          comment: "按状态掩码读 DTC 列表"
        - request: "1903"
          comment: "读快照标识"
        - request: "1904FFFFFF01"
          comment: "按 DTC 读快照记录"
        - request: "190AFF"
          comment: "读支持的 DTC"
    - sid: 0x22
      items:
        - request: "22F183"
          comment: "Bootloader软件版本号"
        - request: "22F184"
          comment: "应用软件指纹"
        - request: "22F187"
          comment: "零部件号"
        - request: "22F18A"
          comment: "供应商代码"
        - request: "22F190"
          comment: "VIN"
        - request: "22F191"
          comment: "ECU 硬件版本号"
        - request: "22F195"
          comment: "ECU 软件版本号"
        - request: "22F1A1"
          comment: "车辆配置"
        - request: "220900"
          comment: "T-Box 硬线唤醒状态"
        - request: "22F1A3"
          comment: "ECU名称"
    - sid: 0x27
      items:
        - request: "2701"
          comment: "请求 Seed(L1/UDS因子)"
        - request: "2702"
          comment: "发送 Key(L1)"
        - request: "2711"
          comment: "请求 Seed(L3/BOOT因子)"
        - request: "2712"
          comment: "发送 Key(L3)"
    - sid: 0x28
      items:
        - request: "280000"
          comment: "使能接收和发送(commType=00)"
        - request: "280001"
          comment: "使能接收和发送(普通通信NCM)"
        - request: "280003"
          comment: "使能接收和发送(普通+网络管理通信)"
        - request: "280301"
          comment: "禁止接收和发送(普通通信NCM)"
    - sid: 0x2E
      items:
        - request: "2EF184"
          comment: "写应用软件指纹(9字节: 年月日BCD+6字节串号)"
        - request: "2EF190"
          comment: "写 VIN"
    - sid: 0x31
      items:
        # 与 B50-4G/335 一致：仅 0203 / 0202；无 FF00/FF01
        - request: "31010203"
          comment: "预编程条件检查 0x0203"
        - request: "31010202"
          comment: "完整性校验 0x0202(CRC32/签名)"
    - sid: 0x3E
      items:
        - request: "3E00"
          comment: "TesterPresent"
        - request: "3E80"
          comment: "TesterPresent（抑制正响应）"
    - sid: 0x85
      items:
        - request: "8501"
          comment: "DTC Setting ON"
        - request: "8502"
          comment: "DTC Setting OFF"
        - request: "8581"
          comment: "DTC Setting ON（抑制正响应）"
        - request: "8582"
          comment: "DTC Setting OFF（抑制正响应）"

flash:
  # B50-5G：34 地址/长度各 4 字节；S19→ZIP→0202×2→1101（无 FF00/FF01，同 B50-4G/335）
  # 包：DoIP-*.zip 内 1-*.s19 + 2-*.zip + 5-*.xml（压缩包架构仍参考 N80）
  memory_address: 0
  address_format: 32
  memorysize_format: 32
  override_block_payload: null
  post_request_download_delay_sec: 0.35
  security_l1_to_l3_delay_sec: 0.35
  transfer_exit_data: null
  # 34/36/37 需要 Level3（TBX 表：RequestDownload/TransferData/RequestTransferExit = 02 会话 + level_3）
  transfer_security_level: 0x11
  # 图7 预编程：功能 10 03 → 物理 0203 → 功能 85 02 / 28 03 01（无 bootloader 发现）
  pre_transfer_raw_requests:
    - payload: "1003"       # (a) extendedSession（功能寻址）
      addressing: functional
    - "31010203"            # (b) checkProgrammingPreconditions（物理寻址）
    - payload: "8502"       # (c) ControlDTCSetting off（功能寻址）
      addressing: functional
    - payload: "280301"     # (d) CommunicationControl disableNonDiagnosticCom（功能寻址）
      addressing: functional
  pre_transfer_routines: []
  # 图8 (a) 物理 10 02；跳过 (b) Vehicle Discovery（无 bootloader）
  diagnostic_sessions_before_download:
    - programming
  # 图8：37 后保持 programming，直接 0202（勿走 10 01 清 0203 缓存）
  post_transfer_session_reassert: "none"
  # L1 在图7 结束后的 extended 内解锁（TBX：27 01/02=03）；L3 在 programming（图8 c）
  security_access_levels_before_download:
    - 0x01
    - 0x11
  # 2E F184 应用软件指纹（9 字节：年/月/日 BCD + 诊断仪串号 6 字节 ASCII，programming+level_3）
  fingerprint_did: 0xF184
  fingerprint_data: "260810414243444546"
  # 图8 (h) checkMemory：0202×2（S19/ZIP，5-*.xml 自动填充）；无 FF00/FF01
  post_transfer_routines:
    - routine_id: 0x0202
      control_type: 1
      data: ""      # 自动填充第 1 个传输文件（S19）签名
    - routine_id: 0x0202
      control_type: 1
      data: ""      # 自动填充第 2 个传输文件（ZIP）签名
  # 后编程（图9；跳过 (b) Vehicle Discovery）：
  #   (a) 11 01 硬复位 → 工具按 post_transfer_reconnect_delay_sec 轮询重连
  #   (c) 10 03 (d) 28 00 01 (e) 85 01 (f) 10 01 (g) 14 FF FF FF（均功能寻址）
  # 功能寻址按 suppress 语义：无应答视为成功。
  post_transfer_raw_requests:
    - "1101"
  post_transfer_reconnect_delay_sec: 350
  post_transfer_after_reconnect_raw_requests:
    - payload: "1003"
      addressing: functional
    - payload: "280001"
      addressing: functional
    - payload: "8501"
      addressing: functional
    - payload: "1001"
      addressing: functional
    - payload: "14FFFFFF"
      addressing: functional












