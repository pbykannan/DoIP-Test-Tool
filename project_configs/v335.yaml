# 英纳法 V335 / B40L-4G TBOX（v335 doip-process）陪测配置
# 依据：
#  - include/v335/diag/diag_data.h + source/v335/diag/diag_data.c（DID 归属 MPU/MCU）
#  - source/v335/diag/uds_handle.c / flash_transfer.c（0203→编程、0202 验签、34/36/37）
#  - tool/ota-tool/.../DOIP_PACK_CONTRACT.md（DoIP 包：1-s19 + 2-tar + 5-CRC）
# DID 读写：按 V335 白名单（未登记 DID → NRC 0x31）
# 刷写：B40L 外层 DoIP-*.zip → S19 + FOTA.tar + 0202×2 → 1101（无 FF00/FF01）
network:
  host: "192.168.4.43"
  tcp_port: 13400
  udp_port: 13400
  # DoIP 发现：known_ip=已知 IP 直连；broadcast=UDP 广播；multicast=UDP 组播
  discovery_mode: "known_ip"
  multicast_address: "239.2.0.1"
  client_bind_ip: null

doip:
  client_logical_address: 0x0E80
  server_logical_address: 0x002B
  protocol_version: 3
  socket_read_timeout: 15
  activation_type: "Default"
  activation_disabled: false
  vm_specific: 0
  uds_addressing: "physical"
  functional_logical_address: 0xE400

uds:
  request_timeout: 30
  # SPI 转发 MCU DID 最长约 7s×3；本地超时略放宽
  use_server_timing: false
  p2_timeout: 0.05
  p2_star_timeout: 5
  server_address_format: null
  server_memorysize_format: null
  # 北汽 v2.0 认证（手写）：SK=CMAC(Key, DF)，Token=CMAC(SK, Seed)，
  # 27 02/12 上传 32 字节 DF||Token。要求对端 16 字节 Seed。
  # L1 主密钥=MCU 日志 ramKey（与 N80KS 因子不同；CompareKey 失败时 MCU 回 NRC 0x0B）。
  security_algorithm: "baic-df-token"
  # 密钥因子（16 字节，均来自 MCU CSE ramKey）：UDS=L1；BOOT=L3
  security_key_level1: "0CDF898CB7260FB85B00CFD25503EC9C"
  security_key_level3: "0F9E79AE136FBDC67F0B5CF6B3053E41"

diagnostics:
  # 诊断树：System/ECU DID 对齐 diag_data.h；写项仅白名单内可写 DID
  service_presets:
    - sid: 0x10
      items:
        - request: "1001"
          comment: "默认会话"
        - request: "1002"
          comment: "编程会话(须先 0203 成功)"
        - request: "1003"
          comment: "扩展会话"
    - sid: 0x11
      items:
        - request: "1101"
          comment: "硬复位(触发OTA/notify_update)"
        - request: "1103"
          comment: "软复位"
    - sid: 0x14
      items:
        - request: "14FFFFFF"
          comment: "清除全部 DTC(转发MCU)"
    - sid: 0x19
      items:
        - request: "1901FF"
          comment: "按状态掩码读 DTC 数量(DoIP回调可能未挂)"
        - request: "1902FF"
          comment: "按状态掩码读 DTC 列表"
        - request: "1903"
          comment: "读快照标识"
        - request: "1904FFFFFF01"
          comment: "按 DTC 读快照记录"
        - request: "190AFF"
          comment: "读支持的 DTC"
    - sid: 0x22
      items:
        # ---- System DID（diag_data.h）----
        - request: "22F183"
          comment: "Boot版本(MPU,10B)"
        - request: "22F184"
          comment: "应用软件指纹(MPU,9B)"
        - request: "22F187"
          comment: "零部件号(MCU,9B)"
        - request: "22F18A"
          comment: "供应商代码(MCU,10B)"
        - request: "22F18C"
          comment: "ECU序列号(MCU)"
        - request: "22F190"
          comment: "VIN(MCU,17B)"
        - request: "22F191"
          comment: "ECU硬件版本(MCU,9B)"
        - request: "22F195"
          comment: "ECU软件版本(MCU,9B)"
        - request: "22F197"
          comment: "系统名称(MCU,9B)"
        - request: "22F0FF"
          comment: "整车版本(MCU,24B)"
        # ---- ECU DID：硬线/电源/时钟/天线 ----
        - request: "220900"
          comment: "硬线唤醒(MCU,2B)"
        - request: "220901"
          comment: "主电压(MCU,1B)"
        - request: "220902"
          comment: "TBox时钟(MCU,6B)"
        - request: "220903"
          comment: "GNSS天线(MCU DID; EOL/modem 另有抽象)"
        - request: "220904"
          comment: "GNSS模块(MPU,1B)"
        - request: "220905"
          comment: "GNSS定位(MPU,1B)"
        - request: "220906"
          comment: "eMMC状态(MPU,1B)"
        - request: "220907"
          comment: "Modem状态(MPU,1B)"
        - request: "220908"
          comment: "平台连接(MPU,1B)"
        - request: "220909"
          comment: "ICCID(MPU,20B)"
        - request: "22090A"
          comment: "APN1(MPU,32B)"
        - request: "22090B"
          comment: "信号强度%(MPU,1B)"
        - request: "22090C"
          comment: "CAN1状态(MCU,1B)"
        - request: "22090D"
          comment: "CAN2状态(MCU,1B)"
        - request: "22090E"
          comment: "休眠模式(MCU)"
        - request: "22090F"
          comment: "CAN3状态(MCU,1B)"
        - request: "220911"
          comment: "APN2(MPU,32B)"
        - request: "220913"
          comment: "4G主天线(MCU DID)"
        - request: "220914"
          comment: "4G从天线(MCU DID)"
        - request: "220915"
          comment: "Checksum计数(MCU,1B)"
        - request: "220916"
          comment: "KeyLine(MCU,1B)"
        - request: "220917"
          comment: "MIC状态(MCU,1B)"
        - request: "220918"
          comment: "扬声器状态(MCU,1B)"
        - request: "220C04"
          comment: "Access Auth(MPU打桩,1B)"
        - request: "222003"
          comment: "CA存储状态(MPU,3B)"
        - request: "222019"
          comment: "UserCode(MPU,约20B)"
        - request: "222051"
          comment: "学习状态(MCU,1B)"
        - request: "222052"
          comment: "学习模式(MCU,1B)"
        - request: "222053"
          comment: "ECU信息(MCU,34B)"
        - request: "222055"
          comment: "随机数(MCU,8B)"
        - request: "222059"
          comment: "钥匙更换状态(MCU,1B)"
        - request: "22205A"
          comment: "KeyValue确认(MCU,16B)"
        - request: "225F0C"
          comment: "IMEI(MPU,15B)"
        - request: "225F0D"
          comment: "IMSI(MPU,15B)"
        - request: "225F0E"
          comment: "远程测试状态(MPU打桩,1B)"
        - request: "225F0F"
          comment: "工厂模式(MPU打桩,1B)"
        - request: "225F10"
          comment: "MSISDN(MPU,15B)"
    - sid: 0x27
      items:
        # 北汽 v2.0：16B Seed → 32B DF||Token（baic-df-token）
        - request: "2701"
          comment: "请求 Seed(L1,UDS因子)"
        - request: "2702"
          comment: "发送 Key(L1,DF||Token)"
        - request: "2711"
          comment: "请求 Seed(L3,BOOT因子)"
        - request: "2712"
          comment: "发送 Key(L3,DF||Token)"
    - sid: 0x28
      items:
        - request: "280000"
          comment: "使能接收和发送(commType=00)"
        - request: "280001"
          comment: "使能接收和发送(普通通信NCM)"
        - request: "280003"
          comment: "使能接收和发送(普通+网络管理通信)"
        - request: "280301"
          comment: "禁止接收和发送(普通通信NCM)"
    - sid: 0x2E
      items:
        # MPU 本地可写：F184 / 0C04 / 5F0F；MCU 转发可写：F190 / F0FF / 2052 / 2057
        - request: "2EF184"
          comment: "写应用软件指纹(MPU,9B:年月日BCD+6字节串号)"
        - request: "2EF190"
          comment: "写 VIN(MCU,17B,扩展会话+L1)"
        - request: "2EF0FF"
          comment: "写整车版本(MCU,24B,扩展会话+L1)"
        - request: "2E0C04"
          comment: "写 Access Auth(MPU打桩,1B)"
        - request: "2E5F0F"
          comment: "写工厂模式(MPU打桩,1B)"
        - request: "2E2052"
          comment: "写学习模式(MCU,1B)"
        - request: "2E2057"
          comment: "写 SC Code(MCU,3B,只写)"
    - sid: 0x31
      items:
        # DoIP 本地：仅 0203 / 0202；FF00/FF01 板端未实现（NRC 0x31），勿用于 B40L 刷写
        - request: "31010203"
          comment: "预编程条件检查 0x0203(车速+电压;进 10 02 前置)"
        - request: "31010202"
          comment: "完整性校验 0x0202(option=256B RSA 或 4B CRC32)"
    - sid: 0x3E
      items:
        - request: "3E00"
          comment: "TesterPresent"
        - request: "3E80"
          comment: "TesterPresent（抑制正响应）"
    - sid: 0x85
      items:
        - request: "8501"
          comment: "DTC Setting ON"
        - request: "8502"
          comment: "DTC Setting OFF"
        - request: "8581"
          comment: "DTC Setting ON（抑制正响应）"
        - request: "8582"
          comment: "DTC Setting OFF（抑制正响应）"

flash:
  # B40L：34 地址/长度各 4 字节；S19→TAR→0202×2→1101（无 FF00/FF01）
  # 包：DoIP-*.zip 内 1-*.s19 + 2-*.tar + 5-CRC_*.xml（见 ota-tool DOIP_PACK_CONTRACT）
  memory_address: 0
  address_format: 32
  memorysize_format: 32
  override_block_payload: null
  post_request_download_delay_sec: 0.35
  security_l1_to_l3_delay_sec: 0.35
  transfer_exit_data: null
  transfer_security_level: 0x11
  # 图7 预编程：功能 10 03 → 物理 0203 → 功能 85 02 / 28 03 01（无 bootloader 发现）
  pre_transfer_raw_requests:
    - payload: "1003"
      addressing: functional
    - "31010203"
    - payload: "8502"
      addressing: functional
    - payload: "280301"
      addressing: functional
  pre_transfer_routines: []
  # 图8：预编程后进 programming（物理 10 02）；跳过 Vehicle Discovery
  diagnostic_sessions_before_download:
    - programming
  # 图8：37 后保持 programming，直接 0202（勿走奇瑞默认的 01→03→02）
  post_transfer_session_reassert: "none"
  security_access_levels_before_download:
    - 0x01
    - 0x11
  fingerprint_did: 0xF184
  fingerprint_data: "260810414243444546"
  # 图8 (h) checkMemory：0202×2（S19/TAR 签名，5-*.xml 自动填充）；无 FF00/FF01
  post_transfer_routines:
    - routine_id: 0x0202
      control_type: 1
      data: ""      # 自动填充第 1 个传输文件（S19）签名
    - routine_id: 0x0202
      control_type: 1
      data: ""      # 自动填充第 2 个传输文件（TAR）签名
  post_transfer_raw_requests:
    - "1101"
  post_transfer_reconnect_delay_sec: 350
  post_transfer_after_reconnect_raw_requests:
    - payload: "1003"
      addressing: functional
    - payload: "280001"
      addressing: functional
    - payload: "8501"
      addressing: functional
    - payload: "1001"
      addressing: functional
    - payload: "14FFFFFF"
      addressing: functional
